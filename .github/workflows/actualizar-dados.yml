# Actualização diária do índice pré-calculado.
#
# Corre num runner self-hosted porque a geração precisa de uma instância do
# Ollama com o modelo descarregado — coisa que os runners do GitHub não têm.
# Configura um runner na máquina onde o `ollama serve` está a correr e dá-lhe
# a etiqueta `ollama`.
#
# Alternativa sem CI: a mesma coisa por cron local. Ver scripts/cron-actualizar.sh.
#
# Não há publicação a seguir. O browser lê o índice da base em cada visita, por
# isso dados novos aparecem na visita seguinte sem reconstruir nem republicar o
# site — foi essa a principal simplificação trazida pela base de dados.

name: Actualizar dados do IGA

on:
  schedule:
    # 03:00 UTC todos os dias. O intervalo de validade no script é de 24 horas,
    # por isso uma execução diária regenera tudo sem esforço desperdiçado.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerar todos os países, ignorando a validade'
        type: boolean
        default: false

concurrency:
  # Uma passagem completa pode demorar bastante; nunca duas ao mesmo tempo.
  group: dados-iga
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar e gravar
    runs-on: [self-hosted, ollama]
    timeout-minutes: 600
    # Só lê o repositório: os dados vão para a base, não para um commit.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A escrita exige a chave de serviço, que contorna a segurança ao nível
      # da linha. É o único sítio do projecto onde ela é usada.
      - name: Gerar relatórios
        env:
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://127.0.0.1:11434' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3:latest' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dados:gerar -- ${{ inputs.force && '--force' || '' }}

      # Nunca dar por boa uma geração inválida: o índice é lido directamente da
      # base pelo browser, sem mais nenhuma validação pelo caminho.
      - name: Validar o índice
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run dados:verificar
