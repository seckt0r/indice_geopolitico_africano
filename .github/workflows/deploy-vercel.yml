# Publicação no Vercel.
#
# É um workflow reutilizável: serve tanto o push para `main` (via ci-cd.yml)
# como a actualização diária dos dados (via actualizar-dados.yml). Existir num
# só sítio evita que as duas vias divirjam.
#
# Segredos necessários no repositório (Settings → Secrets and variables →
# Actions). Os dois IDs saem de `.vercel/project.json` depois de correr
# `npx vercel link` uma vez:
#   VERCEL_TOKEN       token pessoal ou de equipa
#   VERCEL_ORG_ID      orgId
#   VERCEL_PROJECT_ID  projectId

name: Publicar no Vercel

on:
  workflow_call:
    inputs:
      ambiente:
        description: 'production ou preview'
        type: string
        default: production
    outputs:
      url:
        description: 'URL da publicação'
        value: ${{ jobs.publicar.outputs.url }}
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente a publicar'
        type: choice
        options: [production, preview]
        default: production

concurrency:
  # Nunca duas publicações em produção ao mesmo tempo: a segunda ganharia a
  # corrida pelo alias e poderia repor uma versão anterior.
  group: vercel-${{ inputs.ambiente || 'production' }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar (${{ inputs.ambiente || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.ambiente || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCAO: ${{ (inputs.ambiente || 'production') == 'production' }}

    steps:
      # Falhar aqui, com a instrução à frente, é melhor do que falhar três
      # passos adiante numa mensagem do CLI sobre autenticação.
      - name: Confirmar os segredos
        run: |
          em_falta=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ]      && em_falta="$em_falta VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ]     && em_falta="$em_falta VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && em_falta="$em_falta VERCEL_PROJECT_ID"
          if [ -n "$em_falta" ]; then
            echo "::error::Faltam segredos do Vercel:$em_falta. Corre 'npx vercel link' e define-os em Settings → Secrets and variables → Actions. Ver README, secção Publicação."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Versão fixa: `vercel@latest` já partiu pipelines alheios sem aviso.
      - name: Instalar o Vercel CLI
        run: npm install -g vercel@59

      - name: Obter a configuração do projecto
        run: |
          vercel pull --yes \
            --environment="${{ inputs.ambiente || 'production' }}" \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # Construir aqui, e não no Vercel, mantém o mesmo artefacto que passou
      # pelos testes de qualidade e permite falhar antes de publicar.
      # O `vercel build` NÃO encaminha o ambiente do runner para o comando de
      # build — di-lo no seu próprio aviso, "System environment variables will
      # not be available". Passar a configuração por variável de ambiente
      # resultava num pacote sem endereço de base nenhum. O Vite, esse, lê os
      # ficheiros .env da raiz, por isso é por ficheiro que ela viaja.
      - name: Preparar a configuração pública da base
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam as variáveis SUPABASE_URL e SUPABASE_ANON_KEY. Defina-as em Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          # Ambas são públicas por desenho: viajam no pacote JavaScript e quem
          # protege o índice é a segurança ao nível da linha, não o segredo.
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env.production.local
          echo "Configuração escrita para .env.production.local."

      - name: Construir
        run: |
          if [ "$PRODUCAO" = "true" ]; then
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      # A configuração pública do Supabase é resolvida na compilação pelo
      # vite.config.ts. Sem ela o pacote sai sem saber onde está o índice, e o
      # mapa chega ao visitante sem cor nenhuma.
      - name: Confirmar que o pacote sabe ler o índice
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          estatico=".vercel/output/static"
          if [ ! -d "$estatico" ]; then
            echo "::error::$estatico não existe. O build não produziu artefacto."
            exit 1
          fi
          # Procura recursiva na árvore, e não por padrão de ficheiro: um glob
          # sem correspondência faz o grep falhar por motivo errado e esconde
          # a causa real.
          if ! grep -rqF "$SUPABASE_URL" "$estatico"; then
            echo "::error::O pacote construído não contém o endereço da base."
            echo "Conteúdo de $estatico:"
            find "$estatico" -maxdepth 2 -type f | head -20
            exit 1
          fi
          echo "Configuração da base presente no pacote."

      # Rede de segurança contra a pior falha possível: publicar uma chave
      # privilegiada. A chave de serviço não tem prefixo VITE_ e não deveria
      # sequer estar neste ambiente, mas confirmar custa um segundo.
      - name: Confirmar que nenhuma chave privilegiada foi publicada
        env:
          CHAVE_SERVICO: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$CHAVE_SERVICO" ] && grep -rqF "$CHAVE_SERVICO" .vercel/output/static/ 2>/dev/null; then
            echo "::error::A chave de serviço do Supabase está no artefacto. Publicação abortada."
            exit 1
          fi
          echo "Sem chaves privilegiadas no artefacto."

      - name: Publicar
        id: deploy
        run: |
          if [ "$PRODUCAO" = "true" ]; then
            url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          else
            url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em $url"

      # As funções não passam pelo build do Vite e por isso escapam a todos os
      # testes locais. Um import sem extensão explícita, por exemplo, parte-as
      # em produção sem partir o build — e a falha dá-se a CARREGAR o módulo,
      # antes de qualquer tratamento de erro poder responder. Este teste é o
      # que apanha essa classe de avaria.
      - name: Testar as funções publicadas
        env:
          ALVO: ${{ vars.SITE_URL || steps.deploy.outputs.url }}
        run: |
          echo "A testar $ALVO"

          ping_estado=$(curl -sS -o /tmp/ping.json -w '%{http_code}' --max-time 30 "$ALVO/api/ping" || echo 000)
          if [ "$ping_estado" != "200" ]; then
            echo "::error::/api/ping devolveu $ping_estado. O runtime de funções não está a responder."
            cat /tmp/ping.json 2>/dev/null | head -5
            exit 1
          fi
          echo "/api/ping: 200"

          # Sem cabeçalho de autorização o endpoint de geração tem de recusar.
          # Um 500 aqui significa que a função rebenta ao carregar; um 200 em
          # HTML significa que nem sequer é a função a responder.
          cron_estado=$(curl -sS -o /tmp/cron.json -w '%{http_code}' --max-time 30 "$ALVO/api/cron/gerar" || echo 000)
          if [ "$cron_estado" != "401" ]; then
            echo "::error::/api/cron/gerar devolveu $cron_estado; esperava-se 401."
            head -c 300 /tmp/cron.json 2>/dev/null
            exit 1
          fi
          echo "/api/cron/gerar: 401, como esperado"

          # Um recurso em falta tem de dar 404. Se der 200, o reencaminhamento
          # para a aplicação está a apanhar caminhos de ficheiro e a devolver
          # HTML onde se espera uma imagem.
          ausente=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$ALVO/instituicoes/nao-existe.svg" || echo 000)
          if [ "$ausente" != "404" ]; then
            echo "::error::Um ficheiro inexistente devolveu $ausente; esperava-se 404."
            exit 1
          fi
          echo "recurso em falta: 404, como esperado"

      - name: Resumo
        run: |
          {
            echo "## Publicação no Vercel"
            echo ""
            echo "- **URL**: ${{ steps.deploy.outputs.url }}"
            echo "- **Ambiente**: ${{ inputs.ambiente || 'production' }}"
            echo "- **Commit**: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
