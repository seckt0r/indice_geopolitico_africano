<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="igaDarkContinentFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF0F5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#EAF0F5" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- ISOTYPE / EMBLEM FOR DARK BACKGROUND -->
  <g transform="translate(8, 5) scale(0.8)">
    <!-- Orbital ring behind continent -->
    <path d="M 6 55 C 6 44 94 44 94 55" fill="none" stroke="#E5A84B" stroke-width="1.3" stroke-dasharray="2.5 2" opacity="0.65"/>

    <!-- Geopolitical Meridians -->
    <path d="M 50 10 C 35 32 37 68 55 95" fill="none" stroke="#7AA2C8" stroke-width="1" opacity="0.35"/>
    <path d="M 65 12 C 77 38 73 68 59 95" fill="none" stroke="#7AA2C8" stroke-width="0.8" opacity="0.25"/>

    <!-- African Continent Body -->
    <path d="M 38 16 C 45 13 54 12 62 15 C 70 17 76 21 78 25 C 80 31 82 37 84 43 C 87 46 93 48 94 52 C 95 55 91 58 87 61 C 83 66 79 72 75 78 C 71 84 66 91 58 96 C 55 96 52 93 51 89 C 50 83 48 76 46 71 C 44 67 41 63 38 62 C 32 62 25 60 19 57 C 13 54 11 49 13 44 C 15 39 21 34 26 30 C 30 26 34 20 38 16 Z" 
          fill="url(#igaDarkContinentFill)" stroke="#EAF0F5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Madagascar -->
    <path d="M 88 68 C 91 65 93 67 92 72 C 90 78 86 84 84 88 C 82 90 81 89 82 86 C 84 81 87 74 88 68 Z"
          fill="url(#igaDarkContinentFill)" stroke="#EAF0F5" stroke-width="2" stroke-linejoin="round"/>

    <!-- Front Equatorial Arc -->
    <path d="M 94 55 C 94 67 6 67 6 55" fill="none" stroke="#E5A84B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 5-Pillar Constellation Network Lines -->
    <g stroke="#E5A84B" stroke-width="1" opacity="0.8">
      <line x1="60" y1="24" x2="28" y2="48" />
      <line x1="60" y1="24" x2="76" y2="44" />
      <line x1="28" y1="48" x2="52" y2="58" />
      <line x1="76" y1="44" x2="52" y2="58" />
      <line x1="52" y1="58" x2="58" y2="84" />
    </g>

    <circle cx="6" cy="55" r="1.8" fill="#E5A84B" opacity="0.8"/>
    <circle cx="94" cy="55" r="1.8" fill="#E5A84B" opacity="0.8"/>

    <!-- The 5 Nodes -->
    <circle cx="60" cy="24" r="3.2" fill="#121B27" stroke="#E5A84B" stroke-width="1.5"/>
    <circle cx="60" cy="24" r="1.6" fill="#E5A84B"/>

    <circle cx="28" cy="48" r="3.2" fill="#121B27" stroke="#E5A84B" stroke-width="1.5"/>
    <circle cx="28" cy="48" r="1.6" fill="#E5A84B"/>

    <circle cx="52" cy="58" r="3.8" fill="#E5A84B" stroke="#FAF9F6" stroke-width="1.5"/>
    <circle cx="52" cy="58" r="1.8" fill="#121B27"/>

    <circle cx="76" cy="44" r="3.2" fill="#121B27" stroke="#E5A84B" stroke-width="1.5"/>
    <circle cx="76" cy="44" r="1.6" fill="#E5A84B"/>

    <circle cx="58" cy="84" r="3.2" fill="#121B27" stroke="#E5A84B" stroke-width="1.5"/>
    <circle cx="58" cy="84" r="1.6" fill="#E5A84B"/>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(106, 0)">
    <text x="0" y="44" font-family="'Source Serif 4', Merriweather, Georgia, serif" font-size="40" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">IGA</text>
    <circle cx="106" cy="27" r="3.5" fill="#E5A84B"/>
    <text x="0" y="62" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.14em" fill="#EAF0F5">ÍNDICE GEOPOLÍTICO AFRICANO</text>
    <text x="0" y="77" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="0.12em" fill="#9FB0C3">CATÁLOGO DE ANÁLISE ESTRATÉGICA</text>
  </g>
</svg>
